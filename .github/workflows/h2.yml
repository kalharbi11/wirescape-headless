# SPDX-License-Identifier: GPL-3.0-only
# H2 owner-requested only; hardware soaks remain owner runs.
name: H2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Owner-requested switch test"
  switch200:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-engine
      - name: 200 API switches, null audio
        env:
          WIRESCAPE_SWITCH_COUNT: "200"
        run: python -m unittest tests.integration.test_real_engine.RealEngine.test_pg3_and_pg7_api_switches_with_sse_disconnect -v
  gate:
    name: H2 gate
    if: always()
    needs: [scope, switch200]
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.scope.result }}" = success && test "${{ needs.switch200.result }}" = success
