# H1 (lab proposals/0025 §5.3): ready (non-draft) PRs and main.
# Builds the pinned engine on linux-x64 and linux-arm64; devices remain off.
# Required check: "H1 gate".
name: H1
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: h1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.s.outputs.code }}
      ready: ${{ steps.r.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: s
        name: Docs-only or code
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scope.py "$BASE" >> "$GITHUB_OUTPUT"
      - id: r
        name: Ready (not draft)
        run: echo "ready=${{ github.event.pull_request.draft != true }}" >> "$GITHUB_OUTPUT"
  engine:
    needs: scope
    if: needs.scope.outputs.code == 'true' && needs.scope.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-engine
      - name: Real engine acceptance (null audio)
        run: python -m unittest discover -s tests/integration -p 'test_*.py' -v
  ui:
    needs: scope
    if: needs.scope.outputs.ready == 'true' && needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests/ui -p 'test_*.py' -v
  gate:
    name: H1 gate
    if: always()
    needs: [scope, engine, ui]
    runs-on: ubuntu-24.04
    steps:
      - name: All H1 jobs passed or were skipped by scope or draft
        env:
          RESULTS: ${{ needs.scope.result }} ${{ needs.engine.result }} ${{ needs.ui.result }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1;; esac; done
          [ "${{ needs.scope.result }}" = success ]
