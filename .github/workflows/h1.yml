# SPDX-License-Identifier: GPL-3.0-only
# H1 (lab proposals/0025 §5.3): ready (non-draft) PRs and main.
# H-0 runs the pin check only; H-4 adds the engine build at LAB_PIN on linux-x64 and
# linux-arm64 (ccache keyed by LAB_PIN and toolchain) and the --null-audio integration suite.
# Required check: "H1 gate".
name: H1
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: h1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.s.outputs.code }}
      ready: ${{ steps.r.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: s
        name: Docs-only or code
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scope.py "$BASE" >> "$GITHUB_OUTPUT"
      - id: r
        name: Ready (not draft)
        run: echo "ready=${{ github.event.pull_request.draft != true }}" >> "$GITHUB_OUTPUT"
  engine:
    needs: scope
    if: needs.scope.outputs.code == 'true' && needs.scope.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: LAB_PIN fetchable from the lab
        run: python tools/labpin.py verify --remote
      - name: Fetch the lab at the pin
        run: python tools/labpin.py fetch "$RUNNER_TEMP/lab" && test -f "$RUNNER_TEMP/lab/tools/dev.py"
  gate:
    name: H1 gate
    if: always()
    needs: [scope, engine]
    runs-on: ubuntu-24.04
    steps:
      - name: All H1 jobs passed or were skipped by scope or draft
        env:
          RESULTS: ${{ needs.scope.result }} ${{ needs.engine.result }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1;; esac; done
          [ "${{ needs.scope.result }}" = success ]
